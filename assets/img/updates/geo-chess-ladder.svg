<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Geo Chess weekly Elo ladder and rematch">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f4f7ef"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" fill="url(#sky)"/>
  <!-- board -->
  <g transform="translate(40,52)">
    <rect width="168" height="168" rx="10" fill="#1b3a4a"/>
    <g transform="translate(8,8)">
      <rect width="38" height="38" fill="#e8ebd5"/><rect x="38" width="38" height="38" fill="#5f8a9a"/>
      <rect x="76" width="38" height="38" fill="#e8ebd5"/><rect x="114" width="38" height="38" fill="#5f8a9a"/>
      <rect y="38" width="38" height="38" fill="#5f8a9a"/><rect x="38" y="38" width="38" height="38" fill="#e8ebd5"/>
      <rect x="76" y="38" width="38" height="38" fill="#5f8a9a"/><rect x="114" y="38" width="38" height="38" fill="#e8ebd5"/>
      <rect y="76" width="38" height="38" fill="#e8ebd5"/><rect x="38" y="76" width="38" height="38" fill="#5f8a9a"/>
      <rect x="76" y="76" width="38" height="38" fill="#e8ebd5"/><rect x="114" y="76" width="38" height="38" fill="#5f8a9a"/>
      <rect y="114" width="38" height="38" fill="#5f8a9a"/><rect x="38" y="114" width="38" height="38" fill="#e8ebd5"/>
      <rect x="76" y="114" width="38" height="38" fill="#5f8a9a"/><rect x="114" y="114" width="38" height="38" fill="#e8ebd5"/>
      <text x="95" y="102" text-anchor="middle" font-size="34" fill="#fffdf2">^</text>
    </g>
  </g>
  <!-- weekly ladder card -->
  <g transform="translate(236,40)">
    <rect width="360" height="120" rx="14" fill="#fff" stroke="#c5d0e0" stroke-width="2"/>
    <text x="22" y="28" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#3d5a6e" letter-spacing="1.2">THIS WEEK · ELO LADDER</text>
    <text x="300" y="28" font-family="Georgia, serif" font-size="11" fill="#6a7a8a">2026-W45</text>
    <text x="22" y="56" font-family="Georgia, serif" font-size="16" fill="#173d4a">1. MapWizard</text>
    <text x="250" y="56" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1f6b3a">+48</text>
    <text x="22" y="82" font-family="Georgia, serif" font-size="16" fill="#173d4a">2. AtlasKid</text>
    <text x="250" y="82" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1f6b3a">+32</text>
    <text x="22" y="108" font-family="Georgia, serif" font-size="16" fill="#1B4DFF">3. You</text>
    <text x="250" y="108" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#1f6b3a">+16</text>
  </g>
  <!-- rematch chip -->
  <g transform="translate(236,180)">
    <rect width="360" height="56" rx="28" fill="#0E9F6E"/>
    <text x="180" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#fff">Rematch MapWizard</text>
  </g>
</svg>
