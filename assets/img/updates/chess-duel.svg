<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Chess Duel challenge a friend">
  <defs>
    <linearGradient id="cdsky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f2ef"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" fill="url(#cdsky)"/>
  <!-- board -->
  <g transform="translate(70,48)">
    <rect width="176" height="176" rx="10" fill="#23443b"/>
    <g transform="translate(8,8)">
      <rect width="20" height="20" fill="#e8ebd5"/><rect x="20" width="20" height="20" fill="#72957d"/>
      <rect x="40" width="20" height="20" fill="#e8ebd5"/><rect x="60" width="20" height="20" fill="#72957d"/>
      <rect x="80" width="20" height="20" fill="#e8ebd5"/><rect x="100" width="20" height="20" fill="#72957d"/>
      <rect x="120" width="20" height="20" fill="#e8ebd5"/><rect x="140" width="20" height="20" fill="#72957d"/>
      <rect y="20" width="20" height="20" fill="#72957d"/><rect x="20" y="20" width="20" height="20" fill="#e8ebd5"/>
      <rect x="40" y="20" width="20" height="20" fill="#72957d"/><rect x="60" y="20" width="20" height="20" fill="#e8ebd5"/>
      <rect x="80" y="20" width="20" height="20" fill="#72957d"/><rect x="100" y="20" width="20" height="20" fill="#e8ebd5"/>
      <rect x="120" y="20" width="20" height="20" fill="#72957d"/><rect x="140" y="20" width="20" height="20" fill="#e8ebd5"/>
      <rect y="140" width="20" height="20" fill="#72957d"/><rect x="20" y="140" width="20" height="20" fill="#e8ebd5"/>
      <rect x="40" y="140" width="20" height="20" fill="#72957d"/><rect x="60" y="140" width="20" height="20" fill="#e8ebd5"/>
      <rect x="80" y="140" width="20" height="20" fill="#72957d"/><rect x="100" y="140" width="20" height="20" fill="#e8ebd5"/>
      <rect x="120" y="140" width="20" height="20" fill="#72957d"/><rect x="140" y="140" width="20" height="20" fill="#e8ebd5"/>
    </g>
    <text x="88" y="100" text-anchor="middle" font-size="54" fill="#fff8e2">^</text>
  </g>
  <!-- vs pills -->
  <rect x="290" y="88" width="110" height="44" rx="22" fill="#1B4DFF"/>
  <text x="345" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fff">You</text>
  <text x="400" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#b88700">VS</text>
  <rect x="450" y="88" width="120" height="44" rx="22" fill="#0E9F6E"/>
  <text x="510" y="116" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fff">Friend</text>
  <text x="400" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#172e2b">Challenge a friend</text>
  <text x="400" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a6b66">Invite by gamertag · live chess</text>
</svg>
