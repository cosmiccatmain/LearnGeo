<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="Achievement cards stack">
  <defs>
    <linearGradient id="acsky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7f2ef"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="acfront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3d38"/>
      <stop offset="100%" stop-color="#163f4a"/>
    </linearGradient>
    <linearGradient id="acmid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23443b"/>
      <stop offset="100%" stop-color="#1B4DFF"/>
    </linearGradient>
  </defs>
  <rect width="640" height="280" fill="url(#acsky)"/>
  <!-- back cards -->
  <g transform="translate(118,78) rotate(-8)">
    <rect width="210" height="132" rx="16" fill="#2a3231" opacity=".55"/>
  </g>
  <g transform="translate(148,70) rotate(-3)">
    <rect width="210" height="132" rx="16" fill="url(#acmid)" opacity=".85"/>
  </g>
  <!-- front card -->
  <g transform="translate(178,58)">
    <rect width="220" height="140" rx="18" fill="url(#acfront)"/>
    <rect x="22" y="22" width="36" height="24" rx="5" fill="#f6d27a"/>
    <text x="22" y="72" font-family="Georgia, serif" font-size="22" fill="#f4faf8">First Steps</text>
    <text x="22" y="96" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c9ddd7">Answer your first question</text>
    <rect x="22" y="108" width="72" height="18" rx="9" fill="rgba(255,255,255,.16)"/>
    <text x="34" y="121" font-family="ui-monospace, monospace" font-size="11" fill="#f4faf8">+25</text>
  </g>
  <!-- send chip -->
  <rect x="430" y="96" width="150" height="44" rx="22" fill="#0E9F6E"/>
  <text x="505" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="700" fill="#fff">Send by tag</text>
  <text x="505" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#172e2b">Achievement cards</text>
  <text x="505" y="194" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a6b66">Flip · share · school-safe</text>
</svg>
