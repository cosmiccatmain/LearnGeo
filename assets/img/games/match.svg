<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 296" width="644" height="296" role="img" aria-label="Flag Match">
  <!-- LEA-104 brand-new LearnGeo hub cover — vector, not a sheet crop -->
  <!-- LEA-134 editorial plate: one pair turned, the rest face down -->
  <defs>
    <clipPath id="back">
      <rect x="40" y="24" width="168" height="158"/>
    </clipPath>
  </defs>
  <rect width="644" height="296" fill="#E7EEF1"/>
  <rect x="0" y="206" width="644" height="90" fill="#0B1520"/>
  <rect x="0" y="206" width="644" height="3" fill="#0C8F7F"/>

  <!-- face-down catalogue card -->
  <g clip-path="url(#back)" stroke="#0B1520" stroke-opacity="0.16" stroke-width="1">
    <line x1="20" y1="44" x2="80" y2="24"/>
    <line x1="20" y1="68" x2="120" y2="24"/>
    <line x1="20" y1="92" x2="160" y2="24"/>
    <line x1="20" y1="116" x2="200" y2="24"/>
    <line x1="20" y1="140" x2="220" y2="40"/>
    <line x1="20" y1="164" x2="220" y2="64"/>
    <line x1="40" y1="182" x2="220" y2="88"/>
    <line x1="80" y1="182" x2="220" y2="112"/>
    <line x1="120" y1="182" x2="220" y2="136"/>
    <line x1="160" y1="182" x2="220" y2="160"/>
  </g>
  <rect x="40" y="24" width="168" height="158" fill="none" stroke="#0B1520" stroke-width="1.5"/>
  <g transform="translate(124 103) scale(0.46) translate(-50 -50)" fill="#0C8F7F">
    <rect x="17.86" y="17.86" width="29.59" height="29.59" rx="3"/>
    <path d="M52.04 47.45 L52.04 17.86 A29.59 29.59 0 0 1 81.63 47.45 Z"/>
    <path d="M17.86 52.04 L47.45 52.04 L47.45 81.63 A29.59 29.59 0 0 1 17.86 52.04 Z"/>
    <circle cx="66.84" cy="66.84" r="14.79"/>
  </g>

  <!-- flag face -->
  <rect x="238" y="24" width="168" height="158" fill="#F7FBFC" stroke="#0C8F7F" stroke-width="2"/>
  <rect x="276" y="78" width="92" height="62" fill="#F7FBFC" stroke="#0B1520" stroke-width="1"/>
  <circle cx="322" cy="109" r="16" fill="#BC002D"/>
  <text x="250" y="46" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0C8F7F" letter-spacing="1.4">01</text>

  <!-- name face, same index -->
  <rect x="436" y="24" width="168" height="158" fill="#F7FBFC" stroke="#0C8F7F" stroke-width="2"/>
  <text x="450" y="46" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0C8F7F" letter-spacing="1.4">01</text>
  <text x="520" y="118" text-anchor="middle" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#0B1520" letter-spacing="1.2">JAPAN</text>

  <line x1="28" y1="232" x2="76" y2="232" stroke="#0C8F7F" stroke-width="3"/>
  <text x="28" y="270" font-family="Inter, 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#F7FBFC" letter-spacing="-0.6">Flag Match</text>
</svg>
